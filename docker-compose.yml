# Core stack for the Livo agent server (KVM 1: 1 vCPU, 4 GB RAM).
# Nothing here publishes a port to the internet:
#   - n8n is reachable publicly only through the Cloudflare Tunnel (cloudflared)
#   - n8n's editor and Postgres are reachable on the server itself (127.0.0.1)
#     and from your devices over Tailscale (see scripts/tailscale-serve.sh)
# Versions are pinned in .env; never use :latest here.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}   # read by config/postgres-init on first start
    # Tuned for a small box: few connections, small buffers.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 400m
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      # Set in .env to the Tailscale address (https://txn-agn.<tailnet>.ts.net/) so Google OAuth
      # redirects land on the private editor. Falls back to the public host if unset.
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://${N8N_HOST}/}
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Keep the database small.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336        # hours (14 days)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 700m
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  n8ndata:
